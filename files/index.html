<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>範例檔｜AI 升級之路</title>
<link rel="stylesheet" href="../theme.css?v=202611222114">
<style>
main { max-width: 720px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); }
h1 { font-size: var(--fs-2xl); line-height: 1.3; margin: 0 0 var(--sp-2); }
.lead { color: var(--fg-dim); margin: 0 0 var(--sp-6); }
.file { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: var(--sp-4); margin-bottom: var(--sp-4); }
.file h2 { font-size: var(--fs-lg); margin: 0 0 var(--sp-1); }
.file p { color: var(--fg-dim); margin: 0 0 var(--sp-3); }
.file a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--sp-4); border-radius: 10px; background: var(--fg); color: var(--bg); font-weight: 700; text-decoration: none; }
.how { color: var(--fg-dim); font-size: var(--fs-sm); line-height: 1.7; }
</style>
</head><body>
<main>
  <h1>研習範例檔</h1>
  <p class="lead">手上沒有檔案可以練習的話，從這裡下載。</p>
  <section class="file">
    <h2>學生請假規定</h2>
    <p>取自敏實科技大學學務處公開法規｜純文字檔</p>
    <a href="leave-rules.txt" download="學生請假規定_範例.txt">下載</a>
  </section>
  <p class="how">下載後，在 Claude 輸入框左下角按「＋」上傳這個檔案，再貼闖關網頁開場關「② 讀檔案」那句。<br>手機下載後一樣按「＋」，從檔案裡選它。<br>在 LINE 裡打開的話，先按右上角，改用瀏覽器開啟再下載。</p>
</main>
</body></html>
